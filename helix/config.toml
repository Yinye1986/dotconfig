# 25.07.1
theme = "gruvbox_dark_soft"

[editor]
# scrolloff = 5
# mouse = true
default-yank-register = '+'
# middle-click-paste = true
# scroll-lines = 3
# shell = ['sh', '-c']
line-number = 'relative'
cursorline = true
# cursorcolumn = false
continue-comments = false
# gutters = ['diagnostics', 'spacer', 'line-numbers', 'spacer', 'diff']
# auto-completion = true
# path-completion = true
auto-format = false # on save
# idle-timeout = 250
# completion-timeout = 250
# preview-completion-insert = true
# completion-trigger-len = 2
# completion-replace = false
# auto-info = true
# true-color = false
# undercurl = false
# rulers = [80, 120] #
# bufferline = 'never'
color-modes = true
# text-width = 80
# workspace-lsp-roots	= []
# default-line-ending = 'native'
# insert-final-newline = true
# atomic-save = true
trim-final-newlines = true
trim-trailing-whitespace = true
# popup-border = 'none'
# indent-heuristic = 'hybrid'
jump-label-alphabet = 'anresitodhjgbvkplcmfuwyqzx'
# end-of-line-diagnostics	= 'disable'
clipboard-provider = 'wayland' #
# editor-config = true

# [editor.clipboard-provider.custom]
# yank = { command = 'cat', args = ['/dev/shm/hx-clipboard'] }
# paste = { command = 'tee', args = ['/dev/shm/hx-clipboard'] }
# primary-yank = { command = 'cat', args = ['/dev/shm/hx-pclipboard'] }
# primary-paste = { command = 'tee', args = ['/dev/shm/hx-pclipboard'] }

# [editor.whitespace.render]
# space = 'all'
# tab = 'all'
# nbsp = 'all'
# nnbsp = 'all'
# newline = 'all'
# [editor.whitespace.characters]
# space = '·'
# nbsp = '␣'
# nnbsp = '⍽'
# tab = '→'
# newline = '↩'
# tabpad = '·'

# Normal mode
[keys.normal]
# Normal mode > Movement
n = 'move_char_left'
e = 'move_line_down'
i = 'move_line_up'
o = 'move_char_right'
t = 'find_next_char'
T = 'find_prev_char'
# '.' = 'repeat_last_motion'
0 = "goto_line_start"
# Normal mode > Changes
a = { n = 'insert_mode',  e = 'open_below', i = 'open_above', o = 'append_mode' }
# Normal mode > Selection manipulation
A-e = 'copy_selection_on_next_line'
A-i = 'copy_selection_on_prev_line'
',' = 'keep_primary_selection'
V = 'extend_line_below'
# Normal mode > Search
l = 'search_next'
L = 'search_prev'
# Normal mode > Minor modes > Goto mode
f = "goto_word"

# Insert mode
[keys.insert]
"C-'" = 'normal_mode'
C-n = 'move_char_left'
C-e = 'move_line_down'
C-i = 'move_line_up'
C-o = 'move_char_right'

# Select / extend mode
[keys.select]
"C-'" = 'normal_mode'
n = 'extend_char_left'
e = 'extend_line_down'
i = 'extend_line_up'
o = 'extend_char_right'
